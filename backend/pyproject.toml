[project]
name = "paperfirst-backend"
version = "0.1.0"
description = "Paper First backend, Telegram bot and worker"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.6,<4",
  "asyncpg>=0.29,<1",
  "fastapi>=0.111,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "redis>=5,<6",
  "rq>=1.16,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["paperfirst*"]
