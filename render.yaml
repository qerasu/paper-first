services:
  - type: web
    name: paper-first-tma
    runtime: static
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: /api
    routes:
      - type: rewrite
        source: /api/*
        destination: https://paper-first-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: paper-first-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: PAPERFIRST_ENVIRONMENT
        value: production
      - key: PAPERFIRST_DATABASE_URL
        fromDatabase:
          name: paper-first-db
          property: connectionString
      - key: PAPERFIRST_REDIS_URL
        fromService:
          name: paper-first-redis
          type: keyvalue
          property: connectionString
      - key: PAPERFIRST_BACKEND_CORS_ORIGINS
        value: '["https://paper-first-tma.onrender.com"]'
      - key: PAPERFIRST_GEMINI_API_KEY
        sync: false

  - type: worker
    name: paper-first-worker
    runtime: docker
    rootDir: backend
    plan: starter
    dockerCommand: python -m paperfirst.worker.main
    autoDeployTrigger: checksPass
    envVars:
      - key: PAPERFIRST_ENVIRONMENT
        value: production
      - key: PAPERFIRST_DATABASE_URL
        fromDatabase:
          name: paper-first-db
          property: connectionString
      - key: PAPERFIRST_REDIS_URL
        fromService:
          name: paper-first-redis
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: paper-first-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: paper-first-db
    plan: free
    databaseName: paperfirst
    user: paperfirst
    ipAllowList: []
